<html lang="en">
  <head>
    <!-- Deploy: 2026-10-14 — latest build (supervisor verify & credits, security hardening) -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>EcoCredit – Smart Waste Reporting</title>
    <meta name="description" content="Report waste, earn credits, protect the environment. Smart waste reporting and recycling reward system." />
    <meta name="author" content="EcoCredit" />

    <meta property="og:title" content="EcoCredit – Smart Waste Reporting" />
    <meta property="og:description" content="Report waste, earn credits, protect the environment." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
      <div id="boot-fallback" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,sans-serif;background:#f6f5ef;color:#4a5340;text-align:center;padding:24px">
        <div style="width:36px;height:36px;border:3px solid #8a9a6b;border-top-color:transparent;border-radius:50%;animation:bootspin 0.9s linear infinite"></div>
        <p style="margin:0;font-weight:600">EcoCredit is loading…</p>
        <div id="boot-recover" style="display:none">
          <p style="margin:0 0 10px;font-size:14px">Taking longer than usual. The connection may have dropped.</p>
          <button onclick="location.reload()" style="padding:10px 18px;border:0;border-radius:10px;background:#6b7a4f;color:#fff;font-size:14px;cursor:pointer">Reload app</button>
        </div>
      </div>
      <style>@keyframes bootspin{to{transform:rotate(360deg)}}</style>
    <script>
      (function () {
        function showRecover() {
          var el = document.getElementById("boot-recover");
          if (el) el.style.display = "block";
        }
        setTimeout(function () { if (!window.__APP_MOUNTED__) showRecover(); }, 8000);
        window.addEventListener("error", function () { if (!window.__APP_MOUNTED__) showRecover(); }, true);
        window.addEventListener("unhandledrejection", function () { if (!window.__APP_MOUNTED__) showRecover(); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
